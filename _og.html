<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Source Sans 3';font-style:normal;font-weight:200 900;font-display:block;
  src:url('assets/fonts/source-sans-3.woff2') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:2400px;height:1260px;overflow:hidden;background:#05070E}
.card{position:relative;width:2400px;height:1260px;overflow:hidden;background:
  radial-gradient(1500px 900px at 14% 8%,rgba(34,211,238,.16),transparent 60%),
  radial-gradient(1500px 950px at 88% 92%,rgba(227,79,203,.17),transparent 62%),
  radial-gradient(1400px 900px at 62% 55%,rgba(139,92,246,.20),transparent 64%),
  linear-gradient(165deg,#0A0E1E 0%,#0B0F22 48%,#0A0A14 100%)}
.grain{position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:4px 4px}
.topline{position:absolute;top:0;left:0;right:0;height:7px;
  background:linear-gradient(90deg,#22D3EE,#4F7CFF 36%,#8B5CF6 68%,#E34FCB)}
.frame{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-family:'Source Sans 3',sans-serif;text-align:center;padding:0 140px}
.lock{display:flex;align-items:center;gap:28px;margin-bottom:46px}
.lock img.fmc{height:60px;display:block}
.lock img.adobe{height:104px;display:block;position:relative;top:-4px}
.lock .x{font-size:36px;color:#6b7285;font-weight:400}
.eb{display:inline-flex;align-items:center;gap:18px;padding:21px 52px;border-radius:100px;
  border:3px solid #35D2F2;background:rgba(8,16,36,.72);
  box-shadow:0 0 34px -6px rgba(53,210,242,.55);
  font-size:32px;font-weight:800;letter-spacing:.17em;color:#FFFFFF;text-transform:uppercase;white-space:nowrap}
.eb svg{width:31px;height:31px;flex:0 0 auto}
h1{margin-top:52px;font-weight:800;letter-spacing:-.028em;font-size:182px;line-height:.94;color:#fff;text-shadow:0 6px 50px rgba(0,0,0,.4)}
.rule{margin-top:42px;width:720px;height:5px;border-radius:5px;
  background:linear-gradient(90deg,#22D3EE,#4F7CFF 42%,#8B5CF6 76%,#E34FCB)}
.sub{margin-top:40px;font-weight:700;letter-spacing:-.012em;font-size:70px;line-height:1.14;
  background:linear-gradient(92deg,#2BD8F5 0%,#4F8AFF 34%,#9E7BFF 66%,#F27ADF 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.meta{margin-top:54px;display:flex;align-items:center;gap:28px;font-size:33px;font-weight:700;
  color:#D9DEEA;text-transform:uppercase;letter-spacing:.14em;white-space:nowrap}
.meta .dot{width:9px;height:9px;border-radius:50%;background:#5B8DEF;flex:0 0 auto}
.meta b{font-weight:800;color:#fff}
.meta .mlab{font-size:34px;letter-spacing:.16em;color:#D9DEEA}
.meta .mdate{font-size:58px;letter-spacing:.02em}
.meta{align-items:baseline}
.meta2{margin-top:26px;font-size:30px;color:#BFE8FF;font-weight:700;align-items:center}
.meta2 .dot{background:#8B5CF6}
</style></head><body>
<div class="card">
  <div class="grain"></div>
  <div class="topline"></div>
  <div class="frame">
    <div class="lock">
      <img class="fmc" src="assets/fmc-text-only.png">
      <span class="x">&times;</span>
      <img class="adobe" src="assets/adobe-logo.svg">
    </div>
    <div class="eb">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3ED8F0" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.9 3.9 6 3.9 9s-1.3 6.1-3.9 9c-2.6-2.9-3.9-6-3.9-9s1.3-6.1 3.9-9z"/></svg>
      Global Training Event
    </div>
    <h1>Modern Post<br>in Premiere</h1>
    <div class="rule"></div>
    <div class="sub">Color Mode + AI-Assisted Post-Production</div>
    <div class="meta"><span class="mlab">Live Online</span><span class="dot"></span><b class="mdate">Sept 29&ndash;30, 2026</b></div>
    <div class="meta meta2"><span>Live Captions in 35+ Languages</span><span class="dot"></span><span>180-Day Recordings, Dubbed in 7</span></div>
  </div>
</div>
</body></html>
